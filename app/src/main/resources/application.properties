quarkus.arc.selected-alternatives=io.casehub.persistence.memory.MemoryPlanItemStore,io.casehub.persistence.memory.MemoryReactivePlanItemStore,io.casehub.persistence.memory.InMemoryEventLogRepository,io.casehub.persistence.memory.InMemoryReactiveEventLogRepository,io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,io.casehub.persistence.memory.InMemoryReactiveCaseMetaModelRepository,io.casehub.persistence.memory.InMemoryCaseInstanceRepository,io.casehub.persistence.memory.InMemoryReactiveCaseInstanceRepository,io.casehub.persistence.memory.InMemorySubCaseGroupRepository,io.casehub.persistence.memory.InMemoryReactiveSubCaseGroupRepository
quarkus.arc.exclude-types=io.casehub.persistence.memory.DefaultTestPrincipal,io.casehub.work.runtime.service.NoOpGroupMembershipProvider,io.casehub.work.runtime.service.TenantScopedPrincipal,io.casehub.work.engine.JpaPlanItemStore,io.casehub.blocks.routing.agent.CbrAgentRoutingStrategy,io.casehub.blocks.routing.agent.LlmAgentRoutingStrategy,io.casehub.pages.layout.LayoutResource

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:fsitrading;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.jdbc.transactions=xa
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.packages=io.casehub.fsitrading.app.model,io.casehub.fsitrading.app.deliberation,io.casehub.work.runtime.model,io.casehub.work.runtime.filter,io.casehub.platform.memory.jpa
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.repair-at-start=true
quarkus.flyway.locations=classpath:db/fsitrading/migration,classpath:db/work/migration,classpath:db/memory/migration

quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:fsitrading-qhorus;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.qhorus.jdbc.transactions=xa
quarkus.datasource.qhorus.username=sa
quarkus.datasource.qhorus.password=
quarkus.hibernate-orm.qhorus.datasource=qhorus
quarkus.hibernate-orm.qhorus.packages=io.casehub.qhorus.runtime,io.casehub.ledger.runtime.model,io.casehub.fsitrading.app.ledger
quarkus.hibernate-orm.qhorus.database.generation=none
quarkus.flyway.qhorus.migrate-at-start=true
quarkus.flyway.qhorus.locations=classpath:db/qhorus/migration,classpath:db/ledger/migration,classpath:db/fsitrading-ledger/migration

quarkus.index-dependency.casehub-blocks.group-id=io.casehub
quarkus.index-dependency.casehub-blocks.artifact-id=casehub-blocks

casehub.ledger.datasource=qhorus
casehub.ledger.trust-score.enabled=true
casehub.ledger.trust-score.incremental.enabled=true
casehub.ledger.trust-score.materialization.enabled=true

fsi.deliberation.max-rounds=10
fsi.deliberation.wall-clock-timeout-seconds=900
fsi.deliberation.trend-reversal-threshold=0.5
fsi.deliberation.diminishing-returns-min-established=0.5
fsi.deliberation.converging-consensus-threshold=0.7

casehub.memory.retention.domain=fsitrading
casehub.cbr.retention.domain=fsitrading
casehub.cbr.retention.case-types=strategy-evaluation
casehub.cbr.trust-retention.domain=fsitrading
casehub.cbr.trust-retention.case-types=strategy-evaluation

casehub.pages.layout.sqlite.path=data/layout.db

quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=false
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=20.11.1

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.qhorus.db-kind=postgresql
