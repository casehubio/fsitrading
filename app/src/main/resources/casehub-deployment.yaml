tenancyId: ${TENANT_ID:default}

agents:
  - spec:
      agentId: strategy-agent
      name: Strategy Evaluator
      slot: worker
  - spec:
      agentId: strategy-agent-2
      name: Strategy Evaluator Backup
      slot: worker
  - spec:
      agentId: risk-agent
      name: Risk Monitor
      slot: worker
  - spec:
      agentId: audit-agent
      name: Trade Auditor
      slot: worker

channels:
  - spec:
      name: fsitrading/work
      semantic: APPEND
  - spec:
      name: fsitrading/alerts
      semantic: APPEND
  - spec:
      name: fsitrading/audit
      semantic: APPEND

caseTypes:
  - spec:
      namespace: fsitrading
      name: overnight-incident
      version: "1.0"
  - spec:
      namespace: fsitrading
      name: strategy-evaluation
      version: "1.0"

trust:
  - spec:
      capability: trade-execution
      threshold: 0.7
      minimumObservations: 5
  - spec:
      capability: risk-assessment
      threshold: 0.8
      minimumObservations: 3

adaptations:
  - name: scale-risk-on-volatility
    trigger:
      situation: fsitrading.volatility-spike
      minConfidence: 0.7
      deactivateBelow: 0.5
      cooldown: PT5M
    actions:
      - type: scale
        target: risk-agent
        min: 1
        max: 5

  - name: tighten-trust-on-anomaly
    trigger:
      situation: fsitrading.market-anomaly
      minConfidence: 0.6
    actions:
      - type: update
        target: trade-execution
        nodeType: trust
        fields:
          threshold: 0.9
          bootstrapEscalationRequired: true

  - name: add-forensics-on-breach
    trigger:
      situation: fsitrading.active-breach
      minConfidence: 0.8
    actions:
      - type: add
        nodes:
          agents:
            - spec:
                agentId: forensics-agent
                name: Forensics Specialist
                slot: worker
          channels:
            - spec:
                name: fsitrading/forensics
                semantic: APPEND
      - type: update
        target: risk-assessment
        nodeType: trust
        fields:
          threshold: 0.95
